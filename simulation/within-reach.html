const KEYS = ["p","c","s","t"];
let S;
function reset(){
  S = {screen:"intro", act:0, scene:0, flags:new Set(), sys:{c:D.start.c,s:D.start.s,t:D.start.t},
       prot:ACTS.map(()=>D.start.p), choices:{}, last:null};
}
reset();

const app = document.getElementById("app");
const bar = document.getElementById("bar");

function available(o){ return !o.gate || S.flags.has(o.gate.flag); }
function contTag(k){ return `<span class="cflag">${esc(D.contingencies[k])}</span>`; }
function avatar(a,i){ const n=a.character.name.split(" ").map(w=>w[0]).join(""); return `<span class="avatar av${i+1}" aria-hidden="true">${n}</span>`; }
function rtag(r){ return `<span class="rtag r-${r}">${esc(D.ratings[r].label)}</span>`; }
function mtag(m){ return `<span class="model" title="${esc(D.models[m].help)}">${esc(D.models[m].label)}</span>`; }
function chip(k,v){ const cls=v>0?"up":v<0?"down":"flat"; const lab=k==="p"?ACTS[S.act].character.short+"'s protection":D.indicators[k].label; return `<span class="chip ${cls}">${esc(lab)} ${v>0?"+":""}${v}</span>`; }

function renderBar(deltas){
  if(["intro","end"].includes(S.screen)){ bar.hidden=true; return; }
  bar.hidden=false;
  const a=ACTS[S.act];
  let crumb=`<b>${esc(a.label)}: ${esc(a.character.name)}</b>`;
  if(S.screen==="scene"||S.screen==="feedback") crumb+=` &middot; Decision ${S.scene+1} of ${a.scenes.length}`;
  let dots='<div class="dots">';
  ACTS.forEach((ac,ai)=>ac.scenes.forEach((sc,si)=>{
    const done = ai<S.act || (ai===S.act && (si<S.scene || (si===S.scene && S.screen==="feedback") || S.screen==="actEnd"));
    const now = ai===S.act && si===S.scene && S.screen==="scene";
    dots+=`<i class="${done?"done":now?"now":""}"></i>`;
  }));
  dots+="</div>";
  document.getElementById("crumb").innerHTML=crumb+dots;
  const vals={p:S.prot[S.act],c:S.sys.c,s:S.sys.s,t:S.sys.t};
  document.getElementById("meters").innerHTML=KEYS.map(k=>{
    const lab=k==="p"?a.character.short+"'s protection":D.indicators[k].label;
    const d=deltas&&deltas[k]; const dc=d>0?"up":"down";
    return `<div class="meter ${k==="p"?"prot":""}" title="${esc(D.indicators[k].help)}">
      <span class="dlt ${dc} ${d?"show":""}">${d?(d>0?"+":"")+d:""}</span>
      <div class="lab"><span>${esc(lab)}</span><span>${Math.round(vals[k])}</span></div>
      <div class="track"><div class="fill" style="width:${vals[k]}%"></div></div></div>`;
  }).join("");
  if(deltas) setTimeout(()=>document.querySelectorAll(".dlt.show").forEach(e=>e.classList.remove("show")),2600);
}

function go(screen){ S.screen=screen; render(); window.scrollTo(0,0); const h=app.querySelector("h2,h3"); if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});} }

function render(deltas){
  renderBar(deltas);
  const f={intro:vIntro,act:vAct,scene:vScene,feedback:vFeedback,actEnd:vActEnd,end:vEnd}[S.screen];
  app.innerHTML=f();
  bind();
  postHeight();
}

function vIntro(){
  const who={}; ACTS.forEach(a=>a.contingencies.forEach(c=>who[c]=a.character.short));
  return `
  <section class="card hero">
    <span class="pill">Decision simulation</span>
    <h2>Three workers. Six contingencies. One system to build.</h2>
    <p class="lead">Social security is a human right, and migrant workers face the same life risks as everyone else. Yet they are often excluded from protection by law, by the design of schemes, or simply by the practical realities of their work and migration status.</p>
    <p>In this simulation you follow three migrant workers in a fictional country. Each faces two of the contingencies defined in the ILO Social Security (Minimum Standards) Convention, 1952 (No. 102). At every step you choose the model, option or intervention you consider most appropriate for improving their access to social protection.</p>
  </section>
  <section class="card">
    <h3>Your role</h3>
    <p>${esc(D.learnerRole)}</p>
  </section>
  <section class="card">
    <h3>The setting: ${esc(D.country.name)}</h3>
    <ul class="notes">${D.country.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
    <div class="grid2" style="margin-top:12px">${D.country.origins.map(o=>`<div class="person"><h4>${esc(o.name)}</h4><p class="muted" style="margin:0">${esc(o.text)}</p></div>`).join("")}</div>
  </section>
  <section class="card">
    <h3>The three workers</h3>
    <div class="grid3">${ACTS.map((a,i)=>`<div class="person">
      <div class="phead">${avatar(a,i)}<div><h4>${esc(a.character.name)}, ${a.character.age}</h4><div class="sub">${esc(a.character.role)}, from ${esc(a.character.from)}</div></div></div>
      <div class="flags">${a.contingencies.map(contTag).join("")}</div>
      <p class="muted small" style="margin:0">${esc(a.label)} &middot; four decisions</p></div>`).join("")}</div>
  </section>
  <section class="card">
    <h3>The nine contingencies of Convention No. 102</h3>
    <p class="muted">The six highlighted are the ones you will work on. Each belongs to one of the three workers.</p>
    <div class="c102">${D.contingencyOrder.map(k=>`<div class="${who[k]?"":"off"}">${esc(D.contingencies[k])}<span class="who">${esc(who[k]||"")}</span></div>`).join("")}</div>
  </section>
  <section class="card">
    <h3>How it works</h3>
    <div class="grid2">
      <div>
        <h4>Four indicators</h4>
        <ul class="notes small">${KEYS.map(k=>`<li><b>${esc(D.indicators[k].label)}.</b> ${esc(D.indicators[k].help)}</li>`).join("")}</ul>
        <p class="muted small">Every decision also carries a little standing pressure: doing nothing is never neutral.</p>
      </div>
      <div>
        <h4>Models and ratings</h4>
        <p class="small">Each option is labelled with the type of model it represents, such as a unilateral measure, a social security agreement or a complementary measure. After each choice you will see how it rates against ILO standards and intervention models:</p>
        <p>${["best","good","weak","harm"].map(rtag).join(" ")}</p>
        <p class="muted small">Some decisions carry forward. What you build for one worker may open, or close, options for another.</p>
      </div>
    </div>
    <div class="btnrow"><button class="btn" data-go="start">Begin with ${esc(ACTS[0].character.short)}</button></div>
  </section>`;
}

function vAct(){
  const a=ACTS[S.act];
  return `<section class="card hero">
    <span class="pill">${esc(a.label)}</span>
    <div class="phead">${avatar(a,S.act)}<div><h2 style="margin:0">${esc(a.character.name)}, ${a.character.age}</h2><div class="sub" style="color:#D2E3E6">${esc(a.character.role)} &middot; from ${esc(a.character.from)} &middot; ${esc(a.character.place)}</div></div></div>
    <div class="flags">${a.contingencies.map(contTag).join("")}</div>
    <p class="lead" style="margin-top:10px">${esc(a.brief)}</p>
    <p class="lens"><b>Watch for this.</b> ${esc(a.lens)}</p>
    <div class="btnrow"><button class="btn ghost" data-go="scene" style="background:#fff">Start ${esc(a.label.toLowerCase())}</button></div>
  </section>`;
}

function vScene(){
  const a=ACTS[S.act], sc=a.scenes[S.scene];
  return `<section class="card">
    <span class="pill light">${esc(sc.id)} &middot; ${esc(D.contingencies[sc.contingency])}</span>
    <h2>${esc(sc.title)}</h2>
    <p class="situation">${esc(sc.situation)}</p>
    <p class="forwho">Decision for: <b>${esc(sc.decisionFor)}</b></p>
    <h3 style="font-size:1rem;margin-top:14px">Which option do you recommend?</h3>
    <div class="opts">${sc.options.map(o=>{
      const av=available(o);
      return `<button class="opt ${av?"":"locked"}" ${av?`data-pick="${o.id}"`:'disabled aria-disabled="true"'}>
        <span style="display:flex;gap:6px;flex-wrap:wrap"><span class="ref">${o.id.slice(-1).toUpperCase()}</span>${mtag(o.model)}</span>
        <span class="t">${esc(o.title)}</span><span class="n">${esc(o.note)}</span>
        ${av?"":`<span class="lk">${esc(o.gate.locked)}</span>`}</button>`;
    }).join("")}</div>
  </section>`;
}

function vFeedback(){
  const a=ACTS[S.act], sc=a.scenes[S.scene], o=sc.options.find(x=>x.id===S.choices[sc.id]);
  const vars=(o.variants||[]).filter(v=>S.flags.has(v.flag));
  const dl=S.last.deltas;
  const last=S.scene===a.scenes.length-1;
  return `<section class="card">
    <span class="pill light">${esc(sc.id)} &middot; ${esc(sc.title)}</span>
    <div class="chosen"><div class="muted small">You recommended</div><div class="t">${esc(o.title)}</div><div style="margin-top:6px">${mtag(o.model)}</div></div>
    <div class="fbsec"><h4>What happens</h4><p>${esc(o.happens)}</p>
      ${vars.map(v=>`<p class="variant"><b>Because of an earlier decision.</b> ${esc(v.text)}</p>`).join("")}</div>
    <div class="deltas">${KEYS.map(k=>chip(k,dl[k])).join("")}</div>
    <div class="verdict v-${o.rating}">${rtag(o.rating)}<p>${esc(o.why)}</p></div>
    <div class="grid2">
      <div class="fbsec"><h4>The standards</h4><p class="small">${esc(o.instrument)}</p></div>
      <div class="fbsec"><h4>In practice</h4><p class="small">${esc(o.practice)}</p></div>
    </div>
    <details class="cmp"><summary>How the four options compare</summary>
      ${sc.options.map(x=>`<div class="cmprow ${x.id===o.id?"mine":""}"><div>${rtag(x.rating)}</div><div><div class="t">${esc(x.id.slice(-1).toUpperCase())}. ${esc(x.title)}${x.id===o.id?" <span class='muted small'>(your choice)</span>":""}</div>
        <div class="small">${esc(x.why)}</div>${available(x)?"":`<div class="small muted">Not available in your run: ${esc(x.gate.locked)}</div>`}</div></div>`).join("")}
    </details>
    <div class="btnrow"><button class="btn" data-go="next">${last?"See how "+esc(a.character.short)+" fared":"Next decision"}</button></div>
  </section>`;
}

function vActEnd(){
  const a=ACTS[S.act], v=S.prot[S.act], b=bandIndex(v);
  const rows=a.scenes.map(sc=>{const o=sc.options.find(x=>x.id===S.choices[sc.id]);return `<tr><td class="n">${sc.id}</td><td>${esc(sc.title)}</td><td>${esc(o.title)}</td><td>${rtag(o.rating)}</td></tr>`}).join("");
  const nxt=S.act<ACTS.length-1;
  return `<section class="card">
    <span class="pill light">End of ${esc(a.label.toLowerCase())}</span>
    <div class="phead">${avatar(a,S.act)}<h2 style="margin:0">${esc(a.character.name)}</h2></div>
    <div class="bigband" style="margin:12px 0"><div><div class="score">${Math.round(v)}</div><div class="bandlab">Protection</div></div><p class="lead" style="margin:0">${esc(a.bands[b])}</p></div>
    <table><thead><tr><th></th><th>Decision</th><th>Your recommendation</th><th>Rating</th></tr></thead><tbody>${rows}</tbody></table>
    ${a.bridge?`<p class="bridge"><b>Next.</b> ${esc(a.bridge)}</p>`:""}
    <div class="btnrow"><button class="btn" data-go="${nxt?"nextact":"end"}">${nxt?"Meet "+esc(ACTS[S.act+1].character.short):"See the full picture"}</button></div>
  </section>`;
}

function vEnd(){
  const all=[]; ACTS.forEach(a=>a.scenes.forEach(sc=>all.push({a,sc,o:sc.options.find(x=>x.id===S.choices[sc.id])})));
  const nBest=all.filter(x=>x.o.rating==="best").length;
  const pts={best:3,good:2,weak:1,harm:0}; const score=all.reduce((s,x)=>s+pts[x.o.rating],0);
  const mix={}; all.forEach(x=>mix[x.o.model]=(mix[x.o.model]||0)+1);
  const notes=[...S.flags].filter(f=>D.epilogue[f]).map(f=>D.epilogue[f]);
  const rows=all.map(({a,sc,o})=>{
    const best=sc.options.find(x=>x.rating==="best");
    let right;
    if(o.rating==="best") right=`<span class="muted small">You chose it.</span>`;
    else right=`${esc(best.title)}${available(best)?"":`<div class="small muted">Not available in your run, because of an earlier decision.</div>`}`;
    return `<tr><td class="n">${sc.id}</td><td><b>${esc(sc.title)}</b><div class="small muted">${esc(a.character.short)} &middot; ${esc(D.contingencies[sc.contingency])}</div></td><td>${esc(o.title)}<div style="margin-top:4px">${rtag(o.rating)}</div></td><td>${right}</td></tr>`;
  }).join("");
  return `<section class="card hero">
    <span class="pill">The full picture</span>
    <h2>Three workers, one system</h2>
    <p class="lead">There is no single ending. What follows is assembled from where each worker's protection landed, where the system landed, and the consequences you set in motion.</p>
    <div class="btnrow" style="justify-content:flex-start"><button class="btn ghost" data-go="print" style="background:#fff">Print or save as PDF</button><button class="btn ghost" data-go="restart" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)">Play again</button></div>
  </section>
  <section class="card"><h3>The workers</h3>
    ${ACTS.map((a,i)=>{const v=S.prot[i];return `<div class="sysrow"><div class="phead" style="margin:0">${avatar(a,i)}<div><b>${esc(a.character.short)}</b><div class="v">${Math.round(v)}</div></div></div><p style="margin:0">${esc(a.bands[bandIndex(v)])}</p></div>`}).join("")}
  </section>
  <section class="card"><h3>The system</h3>
    ${["c","s","t"].map(k=>`<div class="sysrow"><div><div class="bandlab">${esc(D.indicators[k].label)}</div><div class="v">${Math.round(S.sys[k])}</div></div><p style="margin:0">${esc(D.systemBands[k][bandIndex(S.sys[k])])}</p></div>`).join("")}
  </section>
  <section class="card"><h3>Your choices against the intervention models</h3>
    <p>You chose the most appropriate option in <b>${nBest} of ${all.length}</b> decisions (${score} of ${all.length*3} points, counting 3 for most appropriate, 2 workable, 1 limited, 0 counterproductive).</p>
    <div style="overflow-x:auto"><table><thead><tr><th></th><th>Decision</th><th>Your recommendation</th><th>Most appropriate option</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>
  <section class="card"><h3>The models you relied on</h3>
    <div class="mix">${Object.keys(D.models).filter(m=>mix[m]).sort((x,y)=>mix[y]-mix[x]).map(m=>`<div>${esc(D.models[m].label)}</div><div class="b"><i style="width:${mix[m]/all.length*100}%"></i></div><div>${mix[m]}</div>`).join("")}</div>
    <p class="muted small" style="margin-top:12px">The intervention models stress that these measures are not mutually exclusive. The most effective strategies combine unilateral reform in the country of employment, coordination through agreements, action by countries of origin and complementary measures that make rights usable.</p>
  </section>
  ${notes.length?`<section class="card"><h3>What you set in motion</h3><ul class="notes">${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></section>`:""}
  <section class="card"><h3>Debrief questions</h3><ol class="deb">${D.debrief.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></section>
  <section class="card"><h3>Instruments and guidance referenced</h3><ul class="notes small">${D.instruments.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>
    <div class="btnrow"><button class="btn ghost" data-go="print">Print or save as PDF</button><button class="btn" data-go="restart">Play again</button></div></section>`;
}

function pick(id){
  const a=ACTS[S.act], sc=a.scenes[S.scene], o=sc.options.find(x=>x.id===id);
  if(!o||!available(o)) return;
  const before={p:S.prot[S.act],c:S.sys.c,s:S.sys.s,t:S.sys.t};
  S.prot[S.act]=applyDelta(S.prot[S.act],o.d.p+D.drift.p);
  ["c","s","t"].forEach(k=>S.sys[k]=applyDelta(S.sys[k],o.d[k]+D.drift[k]));
  const after={p:S.prot[S.act],c:S.sys.c,s:S.sys.s,t:S.sys.t};
  const deltas={}; KEYS.forEach(k=>deltas[k]=Math.round(after[k])-Math.round(before[k]));
  (o.sets||[]).forEach(f=>S.flags.add(f));
  S.choices[sc.id]=id; S.last={deltas};
  S.screen="feedback"; render(deltas); window.scrollTo(0,0);
  const h=app.querySelector(".chosen"); if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}
}

function bind(){
  app.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>pick(b.dataset.pick)));
  app.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
    const g=b.dataset.go;
    if(g==="start"){S.act=0;S.scene=0;go("act");}
    else if(g==="scene"){go("scene");}
    else if(g==="next"){ if(S.scene<ACTS[S.act].scenes.length-1){S.scene++;go("scene");} else go("actEnd"); }
    else if(g==="nextact"){S.act++;S.scene=0;go("act");}
    else if(g==="end"){go("end");}
    else if(g==="restart"){reset();go("intro");}
    else if(g==="print"){window.print();}
  }));
}

// Tell an embedding page how tall the simulation is, so its iframe can resize.
function postHeight(){
  try{ if(window.parent!==window) window.parent.postMessage({type:"within-reach:height",height:document.documentElement.scrollHeight},"*"); }catch(e){}
}
if("ResizeObserver" in window) new ResizeObserver(postHeight).observe(document.body);
window.addEventListener("load",postHeight);

render();
</script>
</body></html>
