<script>
// Shared scoring engine. Inlined into simulation.html and used by build.js for the storyboard.
function normalizeData(D) {
  const L = "abcd";
  D.acts.forEach(act => act.scenes.forEach(sc => {
    const ord = sc.order || [0, 1, 2, 3];
    sc.options = ord.map((i, pos) => {
      const o = sc.options[i];
      o.id = sc.id + L[pos];
      return o;
    });
    delete sc.order;
  }));
  return D;
}

function applyDelta(cur, raw) {
  const k = 0.75;
  let d;
  if (raw >= 0) d = raw * k * Math.max(0.25, (100 - cur) / 65);
  else d = raw * k * Math.max(0.25, (cur + 30) / 95);
  return Math.max(0, Math.min(100, cur + d));
}

function bandIndex(v) { return v < 35 ? 0 : v < 65 ? 1 : 2; }


const D = normalizeData({"title":"Within Reach","subtitle":"Extending social protection to migrant workers","org":"International Training Centre of the ILO, Turin","start":{"p":35,"c":38,"s":55,"t":42},"drift":{"p":-2,"c":-1,"s":0,"t":-1},"indicators":{"p":{"label":"Protection","long":"Protection of the worker in front of you","help":"How well the character in this act is actually protected. Resets for each new character."},"c":{"label":"Coverage","long":"Coverage of migrant workers","help":"Legal and effective coverage of migrant workers across Solandra's social protection system."},"s":{"label":"Sustainability","long":"Financial and administrative sustainability","help":"Whether institutions and budgets can carry what you have asked of them."},"t":{"label":"Trust","long":"Trust in the system","help":"Whether workers come forward, employers declare and partner countries cooperate."}},"models":{"udest":{"label":"Unilateral: country of employment","help":"Solandra changes its own laws, schemes or rules."},"uorig":{"label":"Unilateral: country of origin","help":"Kessaria or Ondara acts on its own for its nationals abroad."},"ssa":{"label":"Social security agreement","help":"A treaty coordinating two social security systems."},"bla":{"label":"Bilateral labour agreement","help":"A labour migration agreement with social security provisions."},"comp":{"label":"Complementary measure","help":"Administrative, practical or information measures that make rights usable."},"mwf":{"label":"Migrant welfare fund","help":"A fund set up by the country of origin for nationals abroad."},"priv":{"label":"Private or voluntary","help":"Market products, private settlements or self-registration."},"none":{"label":"Status quo","help":"Relying on rules and routes that already exist."}},"ratings":{"best":{"label":"Most appropriate","short":"Most appropriate"},"good":{"label":"Workable, with limits","short":"Workable"},"weak":{"label":"Limited","short":"Limited"},"harm":{"label":"Counterproductive","short":"Counterproductive"}},"contingencies":{"medical":"Medical care","sickness":"Sickness","unemployment":"Unemployment","oldage":"Old age","injury":"Employment injury","family":"Family responsibilities","maternity":"Maternity","invalidity":"Invalidity","survivors":"Loss of the family income earner"},"contingencyOrder":["medical","sickness","unemployment","oldage","injury","family","maternity","invalidity","survivors"],"learnerRole":"You are a social protection adviser to the new tripartite Working Group on Social Protection for Migrant Workers in the Republic of Solandra. The group brings together the Ministry of Labour, the Social Insurance Institute, the Ministry of Health, employers' and workers' organizations, a domestic workers' union and liaison officers from the two main countries of origin. Each decision names the institution that will act on your advice.","country":{"name":"Republic of Solandra","facts":["High income, ageing population. About one worker in seven is a migrant.","Six in ten domestic workers and nine in ten seasonal harvest workers are migrants.","The Social Insurance Institute (SII) runs contributory schemes for employees across the nine branches. The National Health Service covers residents with a valid permit.","Tax financed social assistance is limited to nationals and permanent residents.","Work permits for domestic and seasonal workers are tied to a single employer."],"origins":[{"name":"Kessaria","text":"Distant, lower middle income. Main origin of migrant domestic workers. Its Social Insurance Fund covers formal employees working in Kessaria only. No social security agreement with Solandra."},{"name":"Ondara","text":"Neighbouring, lower middle income. Sends most seasonal agricultural workers under a bilateral labour agreement with Solandra that refers to social protection only as 'applicable law'. No social security agreement."}]},"acts":[{"id":1,"label":"Act one","key":"leila","character":{"name":"Leila Varosh","short":"Leila","age":34,"role":"Migrant domestic worker","from":"Kessaria","place":"Capital of Solandra"},"contingencies":["maternity","oldage"],"brief":"Leila has lived in Solandra for seven years. She came on a domestic work permit sponsored by the Arvel family, for whom she still works three days a week. The rest of her week is split between an elderly widower, Mr Dosse, and a young couple who pay her in cash. Before migrating she spent six years as a hospital cleaner in Kessaria, contributing to the Kessarian Social Insurance Fund. She is five months pregnant. She plans to go home when her child is old enough for school and, eventually, to retire there.","lens":"Leila's employers are households, not companies. Watch for options that work on paper but assume an employer with a payroll department.","scenes":[{"id":"1.1","title":"The pregnancy","contingency":"maternity","decisionFor":"Ministry of Labour and Social Insurance Institute of Solandra","situation":"Solandra's Social Insurance Act covers domestic workers only for pensions, and only where they work at least 20 hours a week for a single household. They are excluded from maternity cash benefits. Separately, non-nationals must have held a residence permit for three continuous years before claiming any cash benefit. Leila's permit is renewed annually and is tied to the Arvels, who have told her they will not need her after the birth.","order":[1,0,2,3],"options":[{"title":"Bring domestic workers fully into the Social Insurance Act, on equal terms","note":"All branches, no hours threshold, no nationality or residence conditions.","model":"udest","rating":"best","d":{"p":20,"c":20,"s":4,"t":12},"sets":["equality_in_law","dw_full_coverage"],"happens":"The amendment goes through in eleven months, pushed by the domestic workers' union and opposed by an employers' federation worried about household costs. A transitional clause recognises contributions declared in the twelve months before entry into force. Leila qualifies for fourteen weeks of maternity cash benefit at two thirds of her declared earnings, and dismissing her on grounds of pregnancy is now unlawful. The removal of the residence condition applies to every branch, not only maternity, which nobody outside the working group notices yet.","instrument":"Convention No. 189 (Art. 14) requires social security conditions for domestic workers that are no less favourable than for workers generally, including in respect of maternity. Convention No. 183 sets fourteen weeks of maternity leave with cash benefits of at least two thirds of previous earnings. Convention No. 102 (Art. 68) and Convention No. 118 require equality of treatment between nationals and non-nationals.","practice":"The domestic work intervention model notes that migrant domestic workers are often excluded twice: as domestic workers and as migrants. Removing the sector exclusion and the residence condition in the same reform closes both gaps. Fixing only one leaves most of these workers where they were.","why":"Closes the legal gap at source, for all domestic workers and all branches, through the general scheme rather than a special one."},{"title":"Introduce a tax financed maternity allowance for all mothers resident one year","note":"A floor guarantee, outside the insurance system.","model":"udest","rating":"good","d":{"p":10,"c":10,"s":-8,"t":6},"sets":["spf_maternity"],"happens":"The allowance is flat rate, paid for twelve weeks, and reaches Leila because she has been resident well over a year. It is roughly a third of her earnings. It does nothing about her dismissal, and domestic workers are still outside the contributory scheme, so the next contingency she faces will meet the same wall.","instrument":"Recommendation No. 202 calls for basic income security for persons in active age who are unable to earn sufficient income, including in case of maternity, as part of a national social protection floor, with progressively higher levels of protection built alongside it.","practice":"Non-contributory maternity benefits are a real protection for women with no contributory record. Used alone for workers who do have an employer, they let households off the hook and keep benefits at floor level.","why":"A genuine floor guarantee, but it treats a workforce that has employers as if it had none, and leaves the contributory exclusion in place."},{"title":"Make household employers pay maternity leave directly","note":"No cost to the public purse.","model":"udest","rating":"weak","d":{"p":-4,"c":-2,"s":4,"t":-8},"sets":["employer_liability_maternity"],"happens":"The Arvels are now legally liable for fourteen weeks of Leila's wages. They decide not to renew her permit before the obligation starts. Across the sector, agencies report that households are asking whether candidates plan to have children. Leila receives nothing, and is now looking for a new sponsor while pregnant.","instrument":"Convention No. 183 (Art. 6(8)) provides that employers should not be individually liable for the direct cost of maternity benefits, which should be provided through compulsory social insurance or public funds. The reason is exactly this: individual liability turns pregnancy into a hiring risk.","practice":"Employer liability is common where social insurance is weak. For a household employing one worker, with no payroll margin, it is the option most likely to cause the dismissal it is meant to prevent.","why":"Shifts the cost onto the least able employer and creates a direct incentive to discriminate against pregnant women."},{"title":"Recommend private maternity insurance to migrant domestic workers","note":"A market solution, voluntary.","model":"priv","rating":"harm","d":{"p":-12,"c":-8,"s":-2,"t":-8},"sets":["private_maternity"],"happens":"Two insurers launch products. Both exclude pregnancies already under way, so Leila cannot buy one. Premiums cost about a week's wages a month and uptake among domestic workers stays under five per cent. The policy is cited in the next government report as evidence that coverage options exist.","instrument":"ILO social security standards require collective financing, with the worker's share not exceeding half the total cost (Convention No. 102, Art. 71). Voluntary private insurance paid entirely by the worker meets neither the financing nor the solidarity principle.","practice":"Where private cover is offered as the answer, the workers who need it most are priced out or excluded by pre-existing condition clauses, and the existence of the product is used to argue that no reform is needed.","why":"Places the whole cost on the worker, excludes the very case in front of you and delays the reform that would work."}]},{"id":"1.2","title":"Three households, one record","contingency":"maternity","decisionFor":"Social Insurance Institute (SII)","situation":"Even with the law on her side, Leila's claim depends on her contribution record. Only the Arvels ever registered her, and only for twenty hours a week. Mr Dosse never knew he was supposed to. The young couple pay cash and would rather not know. Registering a household employer currently takes a paper form, a tax number and a visit to an SII office during working hours.","order":[2,3,0,1],"options":[{"title":"A simplified system for household employers, with contributions from the first hour","note":"Register online or by phone, pay per hour worked, any number of employers.","model":"comp","rating":"best","d":{"p":16,"c":16,"s":6,"t":10},"sets":["simplified_registration"],"happens":"The SII launches a portal and a phone line where a household registers with an ID number and declares hours and pay. The contribution is calculated and debited automatically. Each of Leila's three employers declares separately and the SII aggregates her record. Low income households receive a partial subsidy on the employer share. Within a year registered domestic workers rise by a third, and Leila's maternity benefit is recalculated on her full earnings.","instrument":"Recommendation No. 201 (Para. 20) encourages simplified systems for the payment of social security contributions by household employers, including where a domestic worker has several employers. The domestic work intervention model calls for registration and contribution procedures designed for households rather than enterprises.","practice":"Procedures built for enterprises are one of the main reasons households do not register. Systems that make declaring a domestic worker as easy as paying a utility bill consistently outperform enforcement alone.","why":"Removes the administrative barrier for both sides and aggregates multiple employers, which is exactly where domestic workers fall out of the system."},{"title":"Allow retroactive declaration, with a penalty amnesty for six months","note":"Bring past work onto the record.","model":"udest","rating":"good","d":{"p":10,"c":8,"s":4,"t":4},"sets":["retro_declaration"],"happens":"Mr Dosse declares four years of work once the penalties are waived. The young couple do not. Leila's record now shows two employers. The amnesty brings in a burst of arrears that improves the scheme's accounts for a year. Then new declarations fall back, because registering is exactly as difficult as before.","instrument":"Allowing retroactive payment of missed contribution periods is one of the flexibility measures listed in the ILO Guide on extending social protection to migrant workers.","practice":"Amnesties recover the past but do not change the future unless registration itself is made easier. Paired with simplification they are powerful. Alone, they are a one-off.","why":"Recovers lost periods for Leila, but leaves untouched the barrier that caused them."},{"title":"Target households with labour inspection visits","note":"Enforcement first.","model":"comp","rating":"weak","d":{"p":2,"c":2,"s":-6,"t":-6},"sets":["household_inspection"],"happens":"Inspectors need the householder's consent or a warrant to enter. Most visits end at the door. Two households that are inspected dismiss their worker the following week rather than regularise. The campaign consumes a quarter of the inspectorate's domestic work budget and produces eleven registrations.","instrument":"Convention No. 189 (Art. 17) calls for labour inspection measures for domestic work, with due respect for the privacy of the household. The domestic work intervention model notes the legal limits on entering private homes.","practice":"In household employment, inspection works best as a backstop behind simple registration and incentives, not as the lead measure.","why":"A legitimate tool used in the wrong order. Without an easy route to comply, enforcement mostly produces dismissals."},{"title":"Let domestic workers register themselves as self-employed","note":"Takes the household out of the process.","model":"priv","rating":"harm","d":{"p":-10,"c":2,"s":-4,"t":-8},"sets":["self_employed_shift"],"happens":"Registration numbers rise on paper. Leila now pays both shares of contributions herself, about eighteen per cent of her earnings, and none of her employers contribute anything. Self-employed status also removes her maternity leave protection, since there is no employment relationship to take leave from. Many workers who register stop paying within months.","instrument":"Convention No. 189 defines domestic work as work within an employment relationship. Convention No. 102 (Art. 71) limits the worker's share of financing to half the cost. Converting employees into self-employed contributors moves the employer's share onto the worker.","practice":"Misclassification is a recurring shortcut in hard to reach sectors. It inflates coverage statistics while hollowing out both the protection and the financing behind it.","why":"Solves the household's paperwork by removing the household's responsibility, at the worker's expense."}]},{"id":"1.3","title":"Thirteen years in two systems","contingency":"oldage","decisionFor":"Ministry of Labour of Solandra, with the Kessarian liaison officer","situation":"Leila asks the question every migrant worker asks eventually: what happens to my pension? She has six years of contributions in Kessaria and seven in Solandra. Each country requires fifteen years for an old age pension. There is no social security agreement between the two. Under current rules she will receive nothing from either, although she will have paid into both for thirteen years.","order":[0,2,1,3],"options":[{"title":"Negotiate a bilateral social security agreement with Kessaria","note":"Totalization, payment of benefits abroad, domestic workers named in scope.","model":"ssa","rating":"best","d":{"p":18,"c":16,"s":2,"t":12},"sets":["ssa_kessaria"],"happens":"Negotiation takes three years, including an administrative arrangement and liaison offices on both sides. At your insistence the personal scope names domestic workers explicitly. Leila's thirteen years are totalized. Each country will pay a pro rata pension for the years she contributed there, and the Solandran share will be paid to her in Kessaria without reduction. Kessaria asks in return that invalidity and survivors' benefits be included, which you accept.","instrument":"Convention No. 157 and Recommendation No. 167, whose annexes contain model provisions, set out the core principles: equality of treatment, determination of the applicable legislation, maintenance of acquired rights and payment of benefits abroad, totalization and mutual administrative assistance. The SSA intervention model sets out the eight step negotiation process.","practice":"Agreements are the most comprehensive tool for portability, and almost ninety per cent of them cover old age. The domestic work intervention model warns that general references to 'workers' often leave domestic workers out in practice, which is why naming them matters.","why":"The only option that makes her years in both countries count toward a lifelong, periodic pension."},{"title":"Refund her contributions as a lump sum when she leaves","note":"She gets her money back.","model":"udest","rating":"weak","d":{"p":2,"c":-2,"s":2,"t":-2},"sets":["lump_sum_refund"],"happens":"When she leaves, Leila receives her own share of seven years of contributions, less tax at the non-resident rate. The employer share stays in the Solandran fund. The amount covers about eighteen months of household costs in Kessaria. At seventy she will have no pension from Solandra, and still too few years for one from Kessaria.","instrument":"The ICRMW (Art. 27(2)) and CESCR General Comment No. 19 support reimbursement where a benefit cannot otherwise be obtained. The ILO Guide notes that lump sums give limited income security compared with periodic benefits and are often taxed at a disadvantage.","practice":"Refunds are a fallback in the absence of an agreement, not a substitute for one. They convert old age protection into savings that are usually spent long before old age.","why":"Better than keeping her contributions, but it trades a pension for a cheque and leaves the employer's share behind."},{"title":"Kessaria lets nationals abroad keep contributing to its pension scheme","note":"Voluntary continued affiliation, a country of origin measure.","model":"uorig","rating":"good","d":{"p":8,"c":6,"s":2,"t":6},"sets":["kessaria_voluntary"],"happens":"Kessaria amends its law so that nationals abroad can remain affiliated. Leila can now build up her Kessarian record toward fifteen years, paying both shares herself at a reduced voluntary rate, on top of her Solandran contributions. She keeps it up for two years and stops when the baby's costs rise. Her Solandran years still count for nothing.","instrument":"The ILO guidance note on migrant welfare funds recommends allowing voluntary continued affiliation to general national schemes as preferable to separate schemes for migrants, while noting that it usually lacks an employer contribution and should not force workers to pay twice.","practice":"Voluntary affiliation is useful where coverage in the destination is absent or temporary. Where the worker is already contributing in the destination, it asks her to pay twice to compensate for the missing agreement.","why":"A sound complement from the country of origin, but it cannot make her Solandran years count and relies on her paying twice."},{"title":"Kessaria creates a migrant welfare fund with a mandatory fee and savings account","note":"Protection organised by the country of origin.","model":"mwf","rating":"weak","d":{"p":-2,"c":2,"s":-2,"t":-4},"sets":["mwf_mandatory"],"happens":"Every departing worker must now pay a registration fee and a monthly contribution into the fund. Returning members receive their savings plus interest as a lump sum. Recruitment agencies pass the fee on to workers. Leila, who left before the fund existed, is not eligible. For those who are, the fund pays out savings, not pensions, and cannot recognise a single year worked in Solandra.","instrument":"The ILO guidance note on migrant welfare funds states that they cannot substitute for coverage in the country of employment and cannot ensure portability. Under the ILO definition of recruitment fees and related costs, the cost of mandatory enrolment in such funds should not be charged to workers.","practice":"Welfare funds can offer useful services, especially where protection at destination is absent. Designed as mandatory, worker financed savings, they fall short of most social security principles, including solidarity in financing.","why":"Addresses the wrong jurisdiction with the wrong instrument, and charges the worker for it."}]},{"id":"1.4","title":"What the record says","contingency":"oldage","decisionFor":"Social Insurance Institute and Ministry of Finance","situation":"Two years later Leila checks her contribution record for the first time. The Arvels have declared her at the minimum wage for twenty hours a week. She works forty and is paid more. Every month of under-declaration reduces the pension she will eventually receive, in either country. She did not know the record existed, and neither do most of the women she knows.","order":[2,1,3,0],"options":[{"title":"Give households a tax credit for declared domestic work, and match the data","note":"Make full declaration the cheaper option for the household.","model":"udest","rating":"best","d":{"p":14,"c":14,"s":4,"t":8},"sets":["tax_incentive"],"happens":"Households can now deduct half the cost of declared domestic work from income tax, but only for wages declared to the SII. Tax and social security records are matched every year. The Arvels, who want the credit, correct Leila's declaration to forty hours at her real wage. Declared domestic work rises sharply, and the credit costs the treasury less than the contributions it brings in.","instrument":"The domestic work intervention model points to comprehensive formalization policies that combine tax incentives, simplified procedures and information campaigns. Recommendation No. 204 calls for incentives and compliance measures to support the transition to the formal economy.","practice":"Incentives that make compliance financially rational for the household work far better than asking an individual worker to confront her employer.","why":"Changes the household's incentive at scale and uses data the State already holds to keep declarations honest."},{"title":"Send every worker an annual statement in her own language, with a complaints route","note":"Make the record visible to the person it belongs to.","model":"comp","rating":"good","d":{"p":8,"c":6,"s":-2,"t":8},"sets":["record_transparency"],"happens":"Leila receives her statement in Kessarian and uses the complaints line. The SII writes to the Arvels, who correct the last twelve months and dispute the rest. Hundreds of other workers discover similar gaps. The SII's small complaints unit is overwhelmed within a quarter: transparency surfaces the problem faster than the institution can resolve it.","instrument":"The intervention models stress information in the languages of the main countries of origin and effective complaint mechanisms as complementary measures.","practice":"Transparency empowers workers who are able to act on it. It works best when employers already have a strong reason to declare correctly.","why":"Essential and empowering, but it leaves the burden of enforcement on the worker."},{"title":"Run an awareness campaign on pension rights at the airport and consulates","note":"Information at the point of entry.","model":"comp","rating":"weak","d":{"p":2,"c":2,"s":-2,"t":2},"sets":["awareness_only"],"happens":"Posters and leaflets in five languages appear at the airport and in the Kessarian consulate. Recognition surveys look good. Leila will not pass through the airport again until she leaves, and the leaflet does not explain how to check a record or what to do when it is wrong.","instrument":"Awareness raising is a recognised complementary measure in all the intervention models. It is most useful when attached to a concrete action that a worker can take.","practice":"Campaigns at arrival reach workers when pensions are furthest from their minds, and before they have any record to check.","why":"Low cost and harmless, but it informs without enabling anyone to act."},{"title":"Leave it to Leila to sue the Arvels for unpaid contributions","note":"The legal route already exists.","model":"none","rating":"harm","d":{"p":-10,"c":-4,"s":0,"t":-10},"sets":["court_only"],"happens":"The case would take two years and require her to testify against the household whose sponsorship her permit depends on. She does not file. Neither do any of the women she knows. The SII records no disputed declarations that year, which is reported as evidence of compliance.","instrument":"Access to justice is part of effective protection, but ILO social security standards place overall responsibility on the State, including for the proper collection of contributions.","practice":"Where a worker's residence depends on her employer, individual litigation is a right that almost nobody exercises.","why":"Treats a systemic compliance failure as a private dispute, in a relationship where the worker holds almost no power."}]}],"bridge":"Leila's case was about a worker the system had written out twice, once as a domestic worker and once as a migrant. The next worker is fully covered on paper. His problem is time: he is never in Solandra long enough to qualify.","bands":["Leila lost her job when she became pregnant and gave birth without income support. Her thirteen years of contributions in two countries will not add up to a pension in either. She does the same work for the same families, undeclared.","Leila received some support around the birth and part of her working life is now on the record. Her pension depends on whether she keeps paying voluntarily, and on reforms that only partly happened.","Leila took paid maternity leave and returned to households that now declare her full hours. Her years in Kessaria and Solandra will add up to a pension she can draw at home."]},{"id":2,"label":"Act two","key":"dario","character":{"name":"Dario Menth","short":"Dario","age":41,"role":"Migrant seasonal agricultural worker","from":"Ondara","place":"Southern valleys of Solandra"},"contingencies":["sickness","unemployment"],"brief":"Dario has come to Solandra every April for nine years to pick stone fruit in the southern valleys, returning to Ondara each October. He is recruited under the bilateral labour agreement between Solandra and Ondara, which sets wages and housing standards and says of social protection only that 'applicable law' applies. Contributions for sickness, unemployment and pensions are deducted from every payslip. His wife and three children stay in Ondara, where the Social Security Fund covers only people employed in Ondara. His permit lets him work only for the farm that recruited him.","lens":"Every rule in this act is formally equal. Look for the places where equal rules produce unequal results because of when, where and for how long this worker is in the country.","scenes":[{"id":"2.1","title":"Week ten","contingency":"sickness","decisionFor":"Ministry of Labour and Social Insurance Institute","situation":"In the tenth week of the season Dario develops pneumonia. He spends twelve days in hospital and is unfit to work for five weeks. Sickness cash benefit requires six months of continuous contributions immediately before the illness. He has ten weeks. His nine previous seasons of contributions do not count, because each season ended in October. The farm is paying nothing while he is off.","order":[3,1,0,2],"options":[{"title":"Count non-consecutive contribution periods for seasonal workers","note":"For example, 26 weeks over the previous 24 months, across seasons.","model":"udest","rating":"best","d":{"p":18,"c":14,"s":-2,"t":10},"sets":["seasonal_rules_adapted"],"variants":[{"flag":"equality_in_law","text":"Because the residence condition was already removed in act one, the change needs only a regulation on qualifying periods, not a new law. It is in force within three months."}],"happens":"A regulation allows seasonal workers to meet the qualifying period with contributions from earlier seasons. Dario qualifies with room to spare and receives sickness benefit at sixty per cent of his wage for the weeks he cannot work. The cost is modest, because seasonal workers are young and rarely claim, and the contributions they have paid for years finally correspond to a benefit they can reach.","instrument":"ILO social security standards include seasonal workers in their scope and point to the need to adapt benefit conditions to their conditions of employment. The ILO Guide lists flexibility in qualifying conditions, including the counting of non-consecutive periods, among the key unilateral measures.","practice":"The seasonal intervention model identifies the inability to meet minimum requirements, despite contributing, as the core legal barrier for this group. Adapting the rule removes it without creating a separate scheme.","why":"Aligns the qualifying rule with the reality of seasonal work, so that contributions turn into protection."},{"title":"Oblige the employer to pay sick pay for the first four weeks","note":"Short-term illness as an employer responsibility.","model":"udest","rating":"weak","d":{"p":6,"c":2,"s":2,"t":-4},"sets":["employer_sick_pay"],"happens":"The farm pays Dario four weeks of sick pay and then stops. Next April he is not offered a contract. The growers' cooperative quietly advises members to prefer younger applicants. The cost falls hardest on the smallest growers, several of whom turn to labour contractors who do not declare workers at all.","instrument":"Employer paid sick leave can serve as a first tier of protection, but ILO standards favour collectively financed sickness benefits so that the cost of illness does not fall on the individual employer.","practice":"Where the worker's permit and next season depend on the same employer, making that employer pay for illness creates a quiet incentive not to rehire the workers who fall ill.","why":"Some income for Dario now, at the price of his next contract and a new incentive to discriminate."},{"title":"Ondara's migrant welfare fund pays him a sickness grant","note":"The country of origin steps in.","model":"mwf","rating":"weak","d":{"p":4,"c":0,"s":-2,"t":2},"sets":["mwf_sickness"],"happens":"Dario receives a lump sum from the Ondaran fund equal to about ten days' wages. It helps. Meanwhile the Solandran scheme keeps collecting sickness contributions from him and his employer for a benefit he cannot reach, and nobody in Solandra is asked to change anything.","instrument":"The ILO guidance note on migrant welfare funds recognises that they can provide limited benefits such as sickness grants, usually as lump sums, but stresses that they cannot substitute for coverage in the country of employment.","practice":"When the country of origin compensates for a gap at destination, the gap tends to become permanent.","why":"A real but small help that lets the scheme which collected his contributions avoid its obligation."},{"title":"Let the farm end his contract so he can recover at home","note":"The permit ends with the contract.","model":"none","rating":"harm","d":{"p":-16,"c":-8,"s":0,"t":-12},"sets":["sent_home_sick"],"happens":"The farm terminates his contract on the grounds that he cannot work, and his permit ends with it. He travels home still weak, loses the rest of the season's earnings and pays for his own follow-up care in Ondara. His contributions for the season stay in Solandra.","instrument":"Convention No. 97 requires equality of treatment in social security for migrants lawfully in the territory. The seasonal intervention model identifies employer-tied permits and short stays as reasons why workers lose protection they have paid for.","practice":"Termination on grounds of illness, combined with an employer-tied permit, turns a sickness into the loss of income, residence and future work at once.","why":"Converts a temporary illness into the loss of everything, while keeping the contributions."}]},{"id":"2.2","title":"Ninety kilometres from the nearest office","contingency":"sickness","decisionFor":"Social Insurance Institute (SII)","situation":"Assume Dario is eligible. To claim, he needs a medical certificate submitted within three days, a form available only in Solandran, and a visit to the SII office in the provincial capital, ninety kilometres away. He has no car. The farm owns his housing and the minibus. Most of the workers in his dormitory have never heard of sickness benefit.","order":[2,0,1,3],"options":[{"title":"Seasonal outreach desks, mobile units and multilingual digital claims","note":"Bring the institution to the valleys during the harvest.","model":"comp","rating":"best","d":{"p":14,"c":12,"s":-4,"t":12},"sets":["outreach_units"],"variants":[{"flag":"simplified_registration","text":"Because the SII already built a simple digital platform for household employers in act one, the seasonal claims module reuses it. It goes live in six weeks at a fraction of the cost of a new system."}],"happens":"During the harvest the SII runs weekly mobile units in the valleys and a desk at the main cooperative, staffed by Ondaran speakers. Clinics transmit certificates directly. Dario's claim is filed from the hospital. Claims from seasonal workers rise tenfold in the first season, which is a measure of access, not of illness.","instrument":"The seasonal intervention model recommends outreach through mobile units, more local offices in rural areas and digital services, taking account of remote workplaces, long hours and short stays.","practice":"For workers who are in the country for months, not years, an entitlement that requires an office visit during working hours is an entitlement in name only.","why":"Removes the practical barriers where they actually are, and makes the claim independent of the employer."},{"title":"Make the employer responsible for filing claims on workers' behalf","note":"The employer is already on site.","model":"udest","rating":"weak","d":{"p":4,"c":4,"s":2,"t":-6},"sets":["employer_files"],"happens":"Some farms file promptly. Others file late or not at all, and workers have no way to check. At Dario's farm the manager suggests he 'rest a few days' instead. The SII has no record of the claims that were never filed.","instrument":"Employers have obligations to declare and cooperate, but effective access requires procedures that workers can use directly, with a complaints route.","practice":"Routing claims through the employer adds a gatekeeper with an interest in the outcome, particularly where housing and permits are also employer controlled.","why":"Convenient on paper, but it makes the worker's access depend on the party most likely to discourage the claim."},{"title":"Ondara posts a labour attaché to help seasonal workers claim","note":"Consular support from the country of origin.","model":"uorig","rating":"good","d":{"p":8,"c":6,"s":-2,"t":8},"sets":["ondara_attache"],"happens":"Ondara's attaché visits the valleys twice a month and helps workers file. Dario's claim goes in on the ninth day, inside an extended deadline she negotiates with the SII. She covers four valleys alone and cannot be everywhere, but workers now know someone whose job is to help them.","instrument":"The intervention models encourage cooperation through diplomatic and consular representation, and information and support services for nationals abroad.","practice":"Consular support is valuable and chronically under-resourced. It works best when the destination institution also adapts its own procedures.","why":"Helpful support from the country of origin, compensating for a procedure that should itself be accessible."},{"title":"Add a sickness benefit module to Ondara's pre-departure orientation","note":"Tell them before they leave.","model":"uorig","rating":"weak","d":{"p":2,"c":2,"s":0,"t":2},"sets":["pdo_info"],"happens":"Workers hear about sickness benefit in a one hour session in Ondara in March. By June most have forgotten the details, and knowing the rule does not bring the office any closer or translate the form.","instrument":"Pre-departure information is a useful complementary measure, particularly on rights and procedures in the country of employment.","practice":"Information delivered months before it is needed, with no support at the point of claim, rarely changes outcomes.","why":"Worth doing, but it leaves every practical barrier in place."}]},{"id":"2.3","title":"The hailstorm","contingency":"unemployment","decisionFor":"Ministry of Labour, with the Ondaran liaison officer","situation":"The following season, a hailstorm in week six destroys most of the southern orchards. Three hundred seasonal contracts are terminated early. Unemployment benefit requires twelve months of contributions in the last twenty four and availability for work in Solandra, but the workers' permits give them thirty days to leave. Dario has paid unemployment contributions for nine years. He has never been able to claim.","order":[3,1,2,0],"options":[{"title":"Adapt unemployment insurance to seasonal work and let workers change employer","note":"Seasonal qualifying period, benefit while the permit runs, freedom to take other farm work.","model":"udest","rating":"best","d":{"p":18,"c":14,"s":0,"t":10},"sets":["ui_seasonal"],"happens":"A seasonal qualifying period of sixteen weeks over twenty four months is introduced, counted across seasons. Workers whose contracts end early receive benefit for the remaining contracted weeks or until they find other work, and their permits are converted to allow work for any registered agricultural employer. Half of the three hundred, including Dario, are placed on other farms within a month. The rest draw benefit and go home at the end of the planned season.","instrument":"Convention No. 168 requires equality of treatment without discrimination on the basis of nationality, and provides that States shall endeavour to adapt qualifying periods to the occupational circumstances of seasonal workers.","practice":"The combination matters. An adapted qualifying period is of little use if the permit expires before the worker can claim. Sector-wide rather than employer-tied permits make unemployment protection usable.","why":"Makes the benefit reachable and the job search possible, tackling the legal and the migration barrier together."},{"title":"Refund unemployment contributions to seasonal workers each October","note":"Stop taking money for a benefit they cannot use.","model":"udest","rating":"weak","d":{"p":2,"c":-4,"s":2,"t":0},"sets":["ui_refund"],"happens":"Workers receive their share of unemployment contributions every October. Dario's refund is small. The three hundred workers hit by the hailstorm still receive nothing when their contracts end, because the refund replaced the insurance instead of making it work.","instrument":"The ILO Guide describes reimbursement as a compromise where workers cannot benefit from their contributions, and notes that it gives limited income security compared with insurance.","practice":"Refunds address the unfairness of paying for nothing, but they remove protection at exactly the moment a collective shock hits.","why":"Fairer than confiscation, but it gives up on insuring the very risk that just materialised."},{"title":"Exempt seasonal migrant workers from unemployment contributions","note":"Lower costs for growers and workers.","model":"udest","rating":"harm","d":{"p":-10,"c":-12,"s":-4,"t":-8},"sets":["ui_exempt"],"happens":"Growers welcome the saving. Seasonal migrants become cheaper to employ than national workers, and national unions protest. When the hailstorm hits there is no fund to draw on for the affected workers at all, and the scheme loses the contributions of its youngest and least likely claimants.","instrument":"The seasonal intervention model warns that excluding migrant workers creates unfair competition and a perverse incentive to recruit them as cheap and unprotected labour.","practice":"Exemptions that look like relief for workers usually function as a subsidy for employers and a race to the bottom for everyone in the sector.","why":"Removes protection, weakens the scheme and makes migrant workers the cheap option."},{"title":"Renegotiate the labour agreement: guaranteed hours and a social security clause","note":"Minimum paid hours if the season ends early; explicit equality of treatment.","model":"bla","rating":"good","d":{"p":10,"c":8,"s":0,"t":8},"sets":["bla_revised"],"happens":"The revised agreement guarantees payment for a minimum number of hours per contract even if the season ends early, funded by growers through a pooled guarantee fund, and states explicitly that seasonal workers enjoy equality of treatment in social security. Dario is paid for three quarters of his contracted hours. The unemployment scheme itself is unchanged.","instrument":"The intervention models recommend including social security provisions, based on equality of treatment, in bilateral labour agreements and temporary worker programmes, in line with the UN Global Guidance on bilateral labour migration agreements.","practice":"Guaranteed hours in seasonal programmes are an effective income floor for short contracts. They complement social insurance. They do not replace it.","why":"A solid protection negotiated with the country of origin, but it leaves the unemployment scheme itself out of reach."}]},{"id":"2.4","title":"Nine seasons, two countries","contingency":"unemployment","decisionFor":"Ministries of Labour of Solandra and Ondara","situation":"Ondara's minister writes proposing a social security agreement. Dario's situation is the one on the table: nine seasons of Solandran contributions that count for nothing in Ondara, where he works informally in the off season, and a family with no coverage there. Short contribution periods are split across two systems every year. Your negotiators must recommend the scope.","order":[0,3,1,2],"options":[{"title":"A comprehensive agreement covering all nine branches, naming seasonal workers","note":"Totalization for sickness, unemployment and pensions; employment injury and medical care provisions.","model":"ssa","rating":"best","d":{"p":16,"c":18,"s":4,"t":14},"sets":["ssa_ondara_full"],"variants":[{"flag":"ssa_kessaria","text":"Your team reuses the agreement negotiated with Kessaria in act one as its template. Preliminary discussions and the first draft take weeks instead of months."}],"happens":"The agreement takes four years and a detailed administrative arrangement. It totalizes insurance periods in both countries for sickness, unemployment and old age, so Dario's Solandran seasons now count toward Ondaran benefits and the reverse. Employment injury benefits are payable in either country, and medical care received in one can be charged to the institution of the other. Liaison offices exchange data electronically.","instrument":"Convention No. 157 provides that social security agreements should cover at least employees, including seasonal workers as appropriate. The SSA intervention model notes that fewer than half of existing agreements cover branches other than old age, invalidity and survivors.","practice":"The seasonal intervention model treats totalization of non-consecutive periods across both countries as essential. Short-term branches are harder to negotiate, and they are what seasonal workers need most.","why":"Tackles the real problem, short contribution periods split across two systems, for every branch that matters to seasonal workers."},{"title":"A pensions-only agreement","note":"The standard model, quicker to conclude.","model":"ssa","rating":"good","d":{"p":8,"c":8,"s":2,"t":6},"sets":["ssa_ondara_pensions"],"happens":"The agreement is concluded in two years. Dario's seasons will count toward an old age pension, which is valuable. Sickness and unemployment remain unconnected, so each season still starts from zero, and there is no provision for paying employment injury benefits or medical care across the border.","instrument":"According to the SSA intervention model, almost ninety per cent of agreements cover old age, invalidity and survivors' benefits, and fewer than half cover any other branch.","practice":"Pensions-only agreements are a real achievement and the easiest to agree. For short-term workers they protect the most distant risk and leave the immediate ones untouched.","why":"Worth having, but it leaves out the short-term branches that matter most to seasonal workers."},{"title":"Rely on the labour agreement's reference to applicable law","note":"No new treaty needed.","model":"none","rating":"weak","d":{"p":-2,"c":-2,"s":2,"t":-4},"sets":["rely_on_bla"],"happens":"Nothing changes. Dario's contributions continue to count in one country only. When a worker's family asks the Ondaran ministry for help with a Solandran claim, there is no mechanism through which it can act.","instrument":"The intervention models note that social security coverage under a bilateral labour agreement depends on the related national laws and social security agreements, where they exist. A general reference to applicable law does not coordinate two schemes.","practice":"A reference to 'applicable law' confirms the status quo. It is the most common social protection clause in labour agreements and the least effective.","why":"Leaves coordination to chance, which in practice means no coordination."},{"title":"Keep seasonal workers affiliated in Ondara and exempt them in Solandra","note":"Apply the country of origin's legislation.","model":"uorig","rating":"weak","d":{"p":-4,"c":-6,"s":0,"t":-2},"sets":["origin_affiliation_only"],"happens":"Dario now contributes to Ondara's fund while working in Solandra. Ondara's scheme has no sickness benefit payable abroad and no way to verify incapacity in Solandra, so when he falls ill in the valleys he is covered in theory by a scheme that cannot reach him. Solandran growers enjoy lower costs than for national workers.","instrument":"Exemption from affiliation in the country of employment where a worker is already covered at home is a recognised measure, but the general principle is that the law of the country of employment applies (lex loci laboris), with exceptions mainly for posted workers.","practice":"Applying the origin country's law works for short postings by established employers. For seasonal workers hired by destination employers, it removes the employer contribution and leaves short-term risks uncovered where they occur.","why":"Avoids double contributions, but places short-term risks in a scheme that cannot deliver where they happen."}]}],"bridge":"Dario was covered and entitled, and still could not reach his benefits until the rules were bent to fit his working year. The last worker has no entitlement on paper at all. Some of what you built for Leila and Dario may now be the only thing between him and destitution.","bands":["Dario has now paid into Solandra's sickness and unemployment insurance for more than a decade without being able to claim once. When he fell ill and when the harvest failed, he absorbed the loss himself.","Dario was helped when things went wrong, through his employer, the labour agreement or his own government, but the insurance he pays for still does not fit a working year split across two countries.","Dario's contributions now follow his working year and his border crossings. When he fell ill he was paid, when the season failed he was protected, and his seasons count in both countries."]},{"id":3,"label":"Act three","key":"ilyas","character":{"name":"Ilyas Ferro","short":"Ilyas","age":27,"role":"Migrant worker in an irregular situation","from":"Ondara","place":"Capital of Solandra"},"contingencies":["injury","medical"],"brief":"Ilyas came to Solandra on a seasonal permit two years running. In his third season the farm withheld two months of wages. He left, and because his permit was tied to that farm he became irregular the day he walked out. For fourteen months he has worked on building sites in the capital for a subcontractor who pays in cash. Last Tuesday he fell four metres from unsecured scaffolding. He has a fractured pelvis and a broken wrist.","lens":"Every option here is limited by decisions taken in the first two acts, and by one question you cannot avoid: will this worker ever come forward if coming forward means being deported?","scenes":[{"id":"3.1","title":"The fall","contingency":"injury","decisionFor":"Social Insurance Institute, employment injury branch","situation":"The site foreman called an ambulance and then left. The subcontractor denies Ilyas ever worked for him. Solandra's employment injury branch covers employees whose employment is declared, and its rules have always required affiliated workers to hold a valid residence permit. Ilyas will not be able to work for at least six months, and possibly never at the same capacity.","order":[1,2,0,3],"options":[{"title":"File the claim directly with the employment injury branch","note":"Covered as a worker, whatever his status.","model":"udest","rating":"best","d":{"p":20,"c":14,"s":-2,"t":14},"sets":["ei_claim_direct"],"gate":{"flag":"equality_in_law","locked":"Not available. The Social Insurance Act still requires a valid residence permit for affiliation. The reform that would have removed that condition was the equality of treatment amendment in act one, and it was not adopted."},"happens":"Because the act one reform removed nationality and residence conditions from every branch, Ilyas is covered as a worker as soon as the employment relationship is established. The SII opens a claim, pays temporary incapacity benefit from the date of the fall and pursues the undeclared employer for the contributions and a penalty. His status plays no part in the decision.","instrument":"Convention No. 19 requires equality of treatment for foreign workers in accident compensation. Convention No. 121 (Art. 27) requires equality of treatment in employment injury benefits without reference to residence. Recommendation No. 151 (Para. 34(1)(b)) provides for work injury compensation regardless of legal status, and Convention No. 143 (Art. 9(1)) protects rights arising from past employment.","practice":"The irregular situation intervention model cites accident compensation laws that explicitly cover all workers regardless of status. It is the clearest case for status-neutral coverage, because the risk is created by the work, not by the worker.","why":"Treats the injury as what it is, a risk of the work, and puts the cost on the employer and the scheme rather than on the worker."},{"title":"Pay from an employment injury guarantee fund and recover from the employer","note":"A fund of last resort for undeclared workers.","model":"udest","rating":"good","d":{"p":14,"c":8,"s":-6,"t":8},"sets":["ei_guarantee_fund"],"happens":"A guarantee fund financed from employer contributions pays injury benefits where the employer failed to declare, and then pursues the employer. Ilyas receives benefits, but only at the fund's minimum rate and only once the employment relationship is established, which takes eleven weeks. The main contractor argues it is not liable for its subcontractor's workers.","instrument":"Guarantee arrangements are a practical way of securing rights arising from past employment, as Convention No. 143 requires, where the employer has not complied.","practice":"Guarantee funds are a useful safety valve. They work best with joint liability along subcontracting chains, so that the cost reaches the firm that controls the site.","why":"Gets benefits to him, but as a fallback outside the ordinary scheme, slower and at a lower level."},{"title":"Advise him to sue the subcontractor in the civil courts","note":"Damages for negligence.","model":"none","rating":"weak","d":{"p":-2,"c":-2,"s":2,"t":-4},"sets":["civil_claim"],"happens":"A legal aid lawyer takes the case. The subcontractor has no assets in his own name. The case will take three years, and Ilyas must remain available to testify in a country where he has no right to stay. He receives nothing in the meantime.","instrument":"Civil remedies exist alongside social insurance, but ILO employment injury standards establish no-fault, collectively financed compensation precisely so that the injured worker does not depend on proving negligence or on the employer's solvency.","practice":"For workers in an irregular situation, litigation is slow, uncertain and exposing, and does nothing for income during recovery.","why":"A remedy in theory that leaves him without income, care or safety for years."},{"title":"Establish his identity and status with immigration before any claim","note":"Status first, entitlement second.","model":"none","rating":"harm","d":{"p":-18,"c":-10,"s":-2,"t":-16},"sets":["status_check_first"],"happens":"The hospital social worker explains the procedure. Ilyas discharges himself the next morning against medical advice. Word spreads on the building sites that injured workers are reported, and the next two serious falls in the capital are not brought to hospital at all.","instrument":"The irregular situation intervention model identifies fear of detention and deportation as a major obstacle to claiming benefits. Recommendation No. 151 and Convention No. 121 detach injury compensation from residence status.","practice":"Making status a precondition does not reduce irregular work. It drives injured workers out of the health and compensation systems, with safety and public health costs for everyone.","why":"Guarantees that he will never claim, and teaches every other worker in the sector the same lesson."}]},{"id":"3.2","title":"Coming forward","contingency":"injury","decisionFor":"Labour inspectorate and Ministry of the Interior","situation":"To establish the employment relationship, the inspectorate needs Ilyas's statement and those of his co-workers, several of whom are also in an irregular situation. The Ministry of the Interior proposes a joint operation on the site. Ilyas asks the inspector what will happen to him if he signs a statement.","order":[2,1,3,0],"options":[{"title":"Grant a bridging permit for the length of the claim, with a route to regularization","note":"Status tied to the claim, not to an employer.","model":"udest","rating":"best","d":{"p":18,"c":12,"s":4,"t":14},"sets":["bridging_permit","firewall"],"happens":"Ilyas receives a temporary permit for as long as his claim and recovery last, with the right to work once he is fit. Four co-workers give statements under the same protection. The inspectorate establishes the employment relationship and the main contractor's liability along the chain. At the end of the claim Ilyas may apply for regular status as a worker with a record of employment.","instrument":"The irregular situation intervention model lists regularization, from simplified procedures to wider campaigns, as a first policy measure, and notes that access to social protection can be part of a regularization process.","practice":"Protected status during a claim turns witnesses into claimants. It is what makes the rest of the enforcement system work.","why":"Removes the fear that blocks every other remedy and opens a path out of irregularity."},{"title":"Guarantee a firewall: no data shared with immigration, no change of status","note":"Protection from reporting, not from removal.","model":"udest","rating":"good","d":{"p":10,"c":6,"s":0,"t":10},"sets":["firewall"],"happens":"The inspectorate confirms in writing that it does not share information with immigration. Ilyas and two co-workers give statements and the claim proceeds. Ilyas remains in an irregular situation, cannot work legally once he recovers, and could still be detected in any routine check.","instrument":"The UN Committee on Migrant Workers (General Comment No. 2) and the irregular situation intervention model identify fear of denunciation as the main barrier to claiming rights, and stress that workers must be able to act without being reported.","practice":"A firewall is the minimum condition for workers in an irregular situation to come forward. Without a status solution, it protects the claim but not the life after it.","why":"The essential minimum, but it leaves him in the situation that made him vulnerable."},{"title":"Accept a confidential cash settlement from the subcontractor","note":"Money now, no statement needed.","model":"priv","rating":"weak","d":{"p":2,"c":-4,"s":0,"t":-4},"sets":["confidential_settlement"],"happens":"The subcontractor offers the equivalent of two months' wages in return for silence. Ilyas accepts because he needs the money. It covers a fraction of his lost earnings. No contributions are recovered, no liability is established, and the scaffolding on the site is still not secured.","instrument":"Employment injury standards require benefits proportionate to the loss of earning capacity, and any lump sum must be the actuarial equivalent of the periodic benefit (Convention No. 121, Art. 15). An informal settlement meets neither test.","practice":"Confidential settlements resolve one case privately and leave the system and the site unchanged.","why":"Some money, no protection, and no change for anyone else on the site."},{"title":"Accept the joint operation with immigration","note":"More resources, more reach.","model":"none","rating":"harm","d":{"p":-16,"c":-8,"s":-2,"t":-18},"sets":["joint_immigration"],"happens":"The operation detains seven workers on status grounds. Ilyas's co-workers are removed before they can testify. Without witnesses the employment relationship cannot be established and his claim stalls. For the rest of the year no worker in an irregular situation in the capital approaches the labour inspectorate.","instrument":"Convention No. 143 protects the rights of workers in an irregular situation arising from past employment, which presupposes that they can safely assert them. The intervention model warns that fear of deportation is a major obstacle to claiming benefits.","practice":"Joint operations reliably destroy the trust on which labour enforcement depends, and the effect lasts long after the operation.","why":"Removes the witnesses, stalls the claim and closes the channel for every worker in the sector."}]},{"id":"3.3","title":"The hospital bill","contingency":"medical","decisionFor":"Ministry of Health","situation":"Ilyas had emergency surgery at a public hospital. The National Health Service covers residents with a valid permit. The hospital's finance office has sent him an invoice for the full cost, and hospital policy requires staff to report uninsured foreign patients to immigration. He needs six more weeks of inpatient care and months of follow-up.","order":[1,0,3,2],"options":[{"title":"Guarantee essential health care for everyone in the territory, with a legal firewall","note":"Emergency, primary, maternal and necessary follow-up care, tax financed.","model":"udest","rating":"best","d":{"p":18,"c":16,"s":-8,"t":14},"sets":["health_firewall"],"variants":[{"flag":"spf_maternity","text":"Because a tax financed maternity floor already exists from act one, the principle of residence-based floor guarantees is established in Solandran law, and the extension to essential health care passes with less resistance."}],"happens":"A new regulation defines a package of essential health care available to anyone in Solandra regardless of status, financed from general revenue, and prohibits health facilities from sharing patients' status with immigration. Ilyas's invoice is cancelled and his follow-up care is scheduled. Within a year, emergency admissions of migrants with late stage conditions begin to fall.","instrument":"Recommendation No. 202 calls for access to essential health care as part of national social protection floors. The UN Committee on Migrant Workers states that urgently required medical care must be ensured, and that public health institutions should not be required to share patients' status with immigration authorities.","practice":"The ILO Guide notes that health care for all migrants improves their health, reduces public health risks and is often a first step toward regularization. Access on paper without a firewall is rarely used.","why":"Meets the health need in full and makes the right usable by removing the fear of reporting."},{"title":"Emergency care free at the point of service; follow-up care charged","note":"The minimum human rights obligation.","model":"udest","rating":"good","d":{"p":8,"c":8,"s":-2,"t":4},"sets":["emergency_only"],"happens":"The surgery invoice is cancelled. The six weeks of inpatient care are reclassified as follow-up and billed. Ilyas leaves hospital early, against advice, and misses physiotherapy. His recovery is slower, and a partial disability that might have been avoided becomes likely.","instrument":"International human rights instruments require, at a minimum, access to emergency health care regardless of status. Recommendation No. 202 sets essential health care, which is broader, as the floor.","practice":"Emergency-only access is common and saves money in the short term, but pushes care toward its most expensive point, the emergency room, and toward avoidable disability.","why":"Meets the minimum obligation, but stops short of the care that decides whether he recovers."},{"title":"Bill him and let the hospital write off what he cannot pay","note":"No policy change.","model":"none","rating":"weak","d":{"p":-4,"c":-2,"s":-4,"t":-4},"sets":["hospital_writeoff"],"happens":"The hospital carries the debt and eventually writes it off. In the meantime the invoice goes to a collection agency. Ilyas avoids every health facility for the next year. Unpaid migrant bills become a line item in the hospital's budget dispute with the ministry.","instrument":"The ILO Guide notes that unaffordable care and fear of deportation are key barriers even where some access exists in law.","practice":"Uncertain charging deters care without recovering the cost, which ends up with hospitals anyway, later and at a higher price.","why":"Costs almost as much as providing care, and still keeps people away from it."},{"title":"Enforce the reporting policy","note":"Hospitals report uninsured foreign patients.","model":"none","rating":"harm","d":{"p":-18,"c":-12,"s":-4,"t":-18},"sets":["health_reporting"],"happens":"The hospital reports Ilyas. He is discharged into immigration detention with his pelvis still healing. Within weeks, clinics in migrant neighbourhoods report sharp drops in attendance, including among pregnant women and children, and a tuberculosis cluster goes undetected for months.","instrument":"The UN Committee on Migrant Workers (General Comment No. 2) states that public health institutions should not be required to share patients' status with immigration authorities.","practice":"Reporting duties in health care are one of the fastest ways to push a whole population out of the health system, with public health consequences well beyond the migrants concerned.","why":"Turns the hospital into a checkpoint and drives an entire population away from care."}]},{"id":"3.4","title":"Going home","contingency":"medical","decisionFor":"Social Insurance Institute, with the Ondaran Social Security Fund","situation":"Six months on, Ilyas walks with a stick. The medical board assesses a permanent loss of earning capacity of twenty per cent. He needs another year of physiotherapy and wants to go home to Ondara, where his family can care for him. What happens to his injury benefit and his medical care when he crosses the border?","order":[1,2,3,0],"options":[{"title":"Transfer his benefits and care under the social security agreement","note":"Periodic injury pension paid in Ondara; care provided there and reimbursed by Solandra.","model":"ssa","rating":"best","d":{"p":20,"c":12,"s":0,"t":12},"sets":["ssa_export_used"],"gate":{"flag":"ssa_ondara_full","locked":"Not available. The agreement with Ondara in act two did not cover employment injury and medical care, or was never concluded, so there is no mechanism to pay his pension or his care across the border."},"happens":"The Solandran institution certifies his entitlement, and the Ondaran liaison office takes over payment of his periodic injury pension in Ondara, without reduction. His physiotherapy is provided by the Ondaran health service and charged to Solandra under the administrative arrangement. His two earlier seasons of contributions are also recognised toward a future pension.","instrument":"Convention No. 157 and Recommendation No. 167 provide for the maintenance of acquired rights and the payment of benefits abroad, including employment injury benefits, and for administrative arrangements on medical care. Convention No. 121 requires equality of treatment without reference to residence.","practice":"This is what an agreement covering short-term branches is for. It turns a return home from the end of protection into a change of address.","why":"Keeps his income and his care intact across the border, as a periodic benefit rather than a one-off payment."},{"title":"Commute his pension to a lump sum; Ondara enrols him in health insurance as a returnee","note":"A clean break in Solandra, a floor at home.","model":"uorig","rating":"good","d":{"p":10,"c":6,"s":2,"t":6},"sets":["lump_sum_injury"],"variants":[{"flag":"ssa_ondara_pensions","text":"Because the pensions agreement exists, his seasonal contributions are at least preserved toward a future old age pension, even though the injury benefit cannot be paid abroad as a pension."}],"happens":"Solandra pays the actuarial equivalent of his periodic benefit as a lump sum, which is permitted for a slight loss of capacity. Ondara enrols him in its national health insurance as a returning migrant with a subsidised contribution. The lump sum loses value in currency conversion and is spent within three years, mostly on his family's debts.","instrument":"Convention No. 121 (Art. 15) allows commutation where the loss of capacity is slight, provided the lump sum is the actuarial equivalent of the periodic benefit. Recommendation No. 121 (Para. 10) suggests not less than three years of periodic payments. The ILO Guide encourages countries of origin to give returning migrants access to social protection floor benefits.","practice":"Commutation is lawful and sometimes preferred by workers, but gives less income security than a periodic benefit. The origin country's floor is a real safety net for returnees.","why":"A lawful and workable fallback, but one that ends his income security within a few years."},{"title":"He stays in Solandra to finish rehabilitation through NGO clinics","note":"Care continues, informally.","model":"comp","rating":"weak","d":{"p":2,"c":0,"s":0,"t":0},"sets":["ngo_care"],"happens":"A migrant health NGO provides physiotherapy twice a month, less than prescribed. Ilyas stays in Solandra, separated from his family, unable to work and without a stable income. His recovery plateaus.","instrument":"Civil society services are an important complement, recognised throughout the intervention models, but they do not replace the State's responsibility for social protection.","practice":"NGO care fills gaps generously and unevenly, and is often the first thing to disappear when funding changes.","why":"Keeps some care going, but outside any entitlement and away from the support he needs."},{"title":"Ondara's welfare fund pays his repatriation and a grant; Solandra closes the file","note":"Home, but on his own.","model":"mwf","rating":"weak","d":{"p":-4,"c":-4,"s":2,"t":-4},"sets":["mwf_repatriation"],"happens":"The fund pays his flight and a grant equal to two months' wages. Solandra closes his file on departure. He has no injury pension, no physiotherapy and no record that his injury happened at work. The grant is spent in six weeks.","instrument":"The ILO guidance note on migrant welfare funds lists repatriation and grants as useful services, while stressing that a fund cannot substitute for coverage in the country of employment or ensure the portability of benefits.","practice":"When the origin country's fund becomes the only response, the destination scheme that should have covered the injury is quietly let off.","why":"Real help with the journey, but it abandons the entitlement that should have followed him home."}]}],"bridge":null,"bands":["Ilyas left Solandra with an unhealed injury, no compensation and no care. Nothing in any record shows that he was injured at work.","Ilyas received treatment and some compensation, but through fallbacks rather than rights. His income security at home will not outlast his recovery.","Ilyas was treated, compensated and protected while he came forward. His injury pension and his care followed him home."]}],"systemBands":{"c":["Migrant workers in Solandra remain largely outside the social protection system, in law or in practice. Coverage figures rest on the workers who least needed help.","Coverage has widened in some branches and for some groups. Gaps remain wherever legal exclusions, qualifying conditions and practical barriers were not tackled together.","Migrant workers are covered in law and increasingly in practice, across the branches that matter to them, whatever sector they work in."],"s":["The reforms have strained institutions and budgets without broadening the base of contributors. The next reform will be harder to finance.","The system is carrying its new responsibilities, with some strain. Costs and contributions are roughly in balance.","Bringing migrant workers into the system has broadened the contributor base. Migrant workers, often net contributors, are helping to finance the schemes that now protect them."],"t":["Migrant workers avoid institutions, employers see no reason to declare, and partner countries have stopped expecting cooperation.","Trust is uneven. Some workers use the system; many still route around it.","Workers come forward, employers declare, and countries of origin treat Solandra as a partner. The system is used because it is believed."]},"epilogue":{"equality_in_law":"The equality of treatment amendment adopted for domestic workers removed residence conditions from every branch. It is the reason an injured worker in an irregular situation could later be covered at all.","employer_liability_maternity":"Maternity costs still fall on individual households. Agencies report that pregnancy remains the most common reason migrant domestic workers are let go.","private_maternity":"The private maternity products are still on the market. Fewer than one migrant domestic worker in twenty has one.","simplified_registration":"Households now register domestic workers online in minutes. The same platform was later reused for seasonal workers, because it was built for employers without payroll departments.","self_employed_shift":"Thousands of domestic workers are registered as self-employed. Most stopped paying within a year, and none of their employers contribute.","ssa_kessaria":"The agreement with Kessaria names domestic workers in its personal scope. Women who spent their working lives in two countries now retire with a pension from both.","lump_sum_refund":"Departing workers receive a refund of their own contributions. Almost none of it is still there when they reach old age.","mwf_mandatory":"Kessaria's welfare fund collects a mandatory fee from every departing worker. Recruitment agencies pass it on, and it cannot recognise a single year worked abroad.","tax_incentive":"Declared domestic work has risen every year since households could claim a tax credit for it. The credit costs less than the contributions it brings in.","court_only":"Under-declaration of domestic workers' wages remains widespread. The SII still reports almost no disputes, because almost nobody can afford to bring one.","seasonal_rules_adapted":"Seasonal workers now qualify for sickness benefit on contributions from earlier seasons. Claims are rare and the cost is small; the principle is not.","sent_home_sick":"Seasonal workers who fall ill are still sent home and lose their permits. They keep paying contributions for benefits they cannot reach.","outreach_units":"Mobile units follow the harvest through the southern valleys. Claims from seasonal workers rose tenfold, which measured access, not illness.","ui_seasonal":"Seasonal workers can now claim unemployment benefit and change employer when a season fails. The next hailstorm did not leave three hundred people without income.","ui_exempt":"Seasonal migrant workers remain exempt from unemployment contributions and remain cheaper than national workers, which national unions have not forgotten.","bla_revised":"The revised labour agreement guarantees minimum paid hours and names equality of treatment in social security. It is the first clause workers quote.","ssa_ondara_full":"The agreement with Ondara covers all nine branches and names seasonal workers. Liaison offices now exchange several thousand records each season.","ssa_ondara_pensions":"The pensions agreement with Ondara protects the most distant risk. Sickness and unemployment still start from zero every season.","bridging_permit":"Workers who report a workplace injury receive a bridging permit for the length of their claim. Labour inspectors now have witnesses.","joint_immigration":"Joint operations with immigration continued. Serious injuries on construction sites are still under-reported, and inspectors know why.","health_firewall":"Essential health care is available to everyone in Solandra, and health facilities may not share patients' status. Clinics now see conditions early, when treatment is cheaper.","health_reporting":"Hospitals still report uninsured foreign patients. Attendance at clinics in migrant neighbourhoods has not recovered, including among children.","ssa_export_used":"Injured workers who go home to Ondara keep their periodic pension and their care. For them, returning home is a change of address, not the end of protection."},"debrief":["For each character, which combination of models (unilateral, bilateral, complementary) proved most effective? Why was no single measure enough?","Which decisions taken for one character turned out to matter for another? What does that suggest about the sequencing of reforms?","Where did an option protect the individual in front of you while weakening the system behind them, or the reverse?","Lump sums and migrant welfare funds appeared several times as fallbacks. When are they appropriate, and when do they let the country of employment off the hook?","In your own country, which of the barriers you met here are legal, which administrative and which practical? Which would you tackle first, and with whom?"],"instruments":["ILO Social Security (Minimum Standards) Convention, 1952 (No. 102)","Equality of Treatment (Accident Compensation) Convention, 1925 (No. 19)","Migration for Employment Convention (Revised), 1949 (No. 97)","Equality of Treatment (Social Security) Convention, 1962 (No. 118)","Employment Injury Benefits Convention, 1964 (No. 121) and Recommendation No. 121","Migrant Workers (Supplementary Provisions) Convention, 1975 (No. 143) and Recommendation No. 151","Maintenance of Social Security Rights Convention, 1982 (No. 157) and Recommendation No. 167","Employment Promotion and Protection against Unemployment Convention, 1988 (No. 168)","Maternity Protection Convention, 2000 (No. 183)","Domestic Workers Convention, 2011 (No. 189) and Recommendation No. 201","Social Protection Floors Recommendation, 2012 (No. 202)","Transition from the Informal to the Formal Economy Recommendation, 2015 (No. 204)","International Convention on the Protection of the Rights of All Migrant Workers and Members of Their Families (ICRMW), and CMW General Comment No. 2","CESCR General Comment No. 19 on the right to social security","ILO, Extending Social Protection to Migrant Workers, Refugees and their Families: A Guide for Policymakers and Practitioners (2021)","ILO intervention models on migrant domestic workers, migrant seasonal agricultural workers, migrant workers in an irregular situation, and negotiating social security agreements","ILO guidance note, Using migrant welfare funds as a social protection instrument (2023)","ILO General principles and operational guidelines for fair recruitment and Definition of recruitment fees and related costs (2019)"]});
